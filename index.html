<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кабинет загадок — Части речи</title>
<style>
:root{--ink:#26382f;--green:#1c5547;--gold:#e9b85b;--paper:#fff6e6}
*{box-sizing:border-box}
body{margin:0;background:#111e1a;color:#f9f0da;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(14px,3vw);background:#152d27;border-bottom:1px solid #507365}
h1{font-family:Georgia,serif;font-size:clamp(20px,3vw,31px);margin:0;color:#f5d89c}
.sub{font-size:12px;color:#b6d0c3;margin-top:3px}
.progress{font-size:14px;white-space:nowrap;color:#f6dcaa}
.track{height:7px;background:#315045;border-radius:8px;margin-top:7px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#d9a24b,#f5dc86);width:0;transition:width .4s}
main{max-width:1550px;margin:0 auto;padding:12px}
.scene{position:relative;width:100%;aspect-ratio:1672/941;background:#264235;border:3px solid #9c7950;border-radius:13px;overflow:hidden;box-shadow:0 20px 60px #0009}
.scene img{width:100%;height:100%;display:block;object-fit:contain}
.hotspot{position:absolute;transform:translate(-50%,-50%);background:transparent;border:0;cursor:pointer;display:grid;place-items:center;touch-action:manipulation}
.hotspot .pin{display:grid;place-items:center;width:clamp(26px,3.4vw,46px);height:clamp(26px,3.4vw,46px);border-radius:50%;border:2px solid #ffe3a1;background:#193e36d9;color:#ffe5a8;font-size:clamp(14px,1.8vw,22px);box-shadow:0 0 0 5px #e8c36a35,0 0 22px #ffdf8799;transition:transform .18s,background .18s}
.hotspot:hover .pin,.hotspot:focus-visible .pin{transform:scale(1.22);background:#d4933a;color:#162e25}
.hotspot.done .pin{background:#16865c;color:white;border-color:#bcf2c5;box-shadow:0 0 0 5px #32d18b44}
.hotspot .tip{position:absolute;bottom:calc(100% + 11px);white-space:nowrap;background:#15392fe8;color:#fff2d2;padding:7px 10px;border:1px solid #dbb97b;border-radius:7px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.hotspot:hover .tip,.hotspot:focus-visible .tip{opacity:1}
.hotspot.door .pin{background:#80552b}
.hotspot.door.ready .pin{background:#16865c;animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px #52db8b25,0 0 24px #b5ffb5}}
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;padding:12px 3px}
.hud small{color:#bfd4c9}
.code{display:flex;gap:7px}
.digit{width:34px;height:39px;display:grid;place-items:center;background:#254338;border:1px solid #9d8a5d;border-radius:7px;font:700 21px Georgia,serif;color:#ffe2a2}
button{font:inherit}
.action{border:1px solid #c3a46c;background:#295b4a;color:#fff6de;border-radius:10px;padding:10px 15px;cursor:pointer;font-weight:650}
.action:hover{background:#38775f}
.action.primary{background:#e8b957;color:#203d31;border-color:#edca7f}
.action.primary:hover{background:#ffce72}
.overlay{position:fixed;inset:0;background:#07150dcc;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.open{display:flex}
.modal{width:min(520px,100%);max-height:min(86vh,760px);overflow:auto;background:var(--paper);color:var(--ink);border:5px solid #b7894c;border-radius:20px;box-shadow:0 18px 70px #000b;position:relative}
.modalHead{padding:22px 24px 14px;background:linear-gradient(120deg,#e8d7b7,#fdf1d7);border-bottom:1px solid #dbc59e}
.kicker{color:#80623b;text-transform:uppercase;letter-spacing:1.5px;font-weight:750;font-size:11px}
h2{font-family:Georgia,serif;font-size:clamp(23px,4vw,29px);margin:6px 0}
.modalBody{padding:20px 24px 24px}
.prompt{line-height:1.5;font-size:16px;margin:0 0 15px}
.options{display:grid;gap:9px}
.option{background:#fffdf6;color:#26382f;border:1.5px solid #c6b899;border-radius:10px;padding:12px;text-align:left;cursor:pointer}
.option:hover,.option.selected{border-color:#1d785a;background:#e3f1e7}
.option.selected{box-shadow:inset 0 0 0 1px #1d785a}
label{display:block;font-weight:650;margin:11px 0 6px}
input[type=text],select{width:100%;padding:12px;background:white;border:1.5px solid #b7ad93;border-radius:9px;font:inherit;color:#26382f}
.controls{display:flex;flex-wrap:wrap;gap:9px;margin-top:17px}
.controls .action{flex:1}
.feedback{margin-top:15px;padding:12px;border-radius:9px;line-height:1.45;display:none}
.feedback.ok{display:block;background:#d9f1df;color:#185c3a}
.feedback.bad{display:block;background:#ffe4d7;color:#873b23}
.feedback.hint{display:block;background:#fff0c6;color:#725018}
.seq{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 13px;border:1px solid #a89065;background:#fff;border-radius:9px;cursor:pointer}
.chip.picked{background:#1f684e;color:white}
.sequence{min-height:44px;border:1px dashed #b4a17d;border-radius:9px;padding:10px;margin:12px 0;background:#fffaf0}
.close{position:absolute;right:12px;top:10px;border:0;background:#ffffffa8;border-radius:50%;font-size:24px;width:36px;height:36px;cursor:pointer;color:#31473a}
footer{text-align:center;color:#a7c2b5;font-size:12px;padding:8px 12px 20px}
@media(max-width:650px){header{align-items:flex-start}.progress{font-size:12px}.scene{border-width:2px;border-radius:7px}.hotspot .pin{width:25px;height:25px;font-size:13px;box-shadow:0 0 0 3px #e8c36a35}.hud{align-items:flex-start}.modal{max-height:88vh;border-width:3px}.modalHead{padding:17px 18px 12px}.modalBody{padding:16px 18px}.tip{display:none}}
</style>
</head>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
<div class="modal">
<button class="close" id="close" aria-label="Закрыть">×</button>
<div class="modalHead"><div class="kicker" id="kicker">Задание</div><h2 id="modalTitle"></h2></div>
<div class="modalBody">
<p class="prompt" id="prompt"></p>
<div id="taskArea"></div>

<script>
const tasks={
books:{title:"Библиотечная карточка",digit:"7",kind:"single",prompt:"Какое слово является именем существительным?",options:["зеленый","библиотека","читать","быстро"],correct:1,hint:"Существительное называет предмет и отвечает на вопросы «кто?» или «что?».",explain:"«Библиотека» — имя существительное, отвечает на вопрос «что?»."},
telescope:{title:"Оптический классификатор",digit:"3",kind:"match",prompt:"Определи часть речи каждого слова.",pairs:[["бежать","Глагол"],["яркий","Прилагательное"],["тихо","Наречие"]],choices:["Глагол","Существительное","Прилагательное","Наречие"],hint:"Действие — глагол, признак предмета — прилагательное, признак действия — наречие.",explain:"Бежать — глагол; яркий — прилагательное; тихо — наречие."},
clock:{title:"Часовой механизм",digit:"9",kind:"sequence",prompt:"Собери предложение из слов в правильном порядке.",pieces:["читает","интересную","Девочка","книгу."],correct:["Девочка","читает","интересную","книгу."],hint:"Начни с подлежащего, затем поставь сказуемое.",explain:"Получилось предложение «Девочка читает интересную книгу»."},
globe:{title:"Географическая запись",digit:"2",kind:"text",prompt:"Исправь ошибку в словосочетании: «красивый картина». Запиши оба слова правильно.",correct:["красивая картина"],hint:"Согласуй прилагательное с существительным женского рода.",explain:"Правильно: «красивая картина». Прилагательное согласуется с существительным в роде."},
chest:{title:"Секрет сундука",digit:"5",kind:"multi",prompt:"Выбери ВСЕ служебные части речи.",options:["предлог","глагол","союз","частица","наречие"],correct:[0,2,3],hint:"Служебные части речи: предлоги, союзы, частицы.",explain:"Предлог, союз и частица — служебные части речи."}
};
const order=["books","telescope","clock","globe","chest"];
const done=new Set();
let active=null, selection=null, multi=new Set(), sequence=[];
const $=id=>document.getElementById(id);
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function update(){
$("counter").textContent=`Найдено ключей: ${done.size} из 5`;
$("fill").style.width=(done.size/5*100)+"%";
$("code").innerHTML=order.map(id=>`<span class="digit">${done.has(id)?tasks[id].digit:"·"}</span>`).join("");
document.querySelectorAll(".hotspot").forEach(el=>el.classList.toggle("done",done.has(el.dataset.id)));
document.querySelector(".door").classList.toggle("ready",done.size===5);
document.querySelector(".door .pin").textContent=done.size===5?"🔓":"🔒";
}
function feedback(text,kind){const el=$("feedback");el.className="feedback "+kind;el.textContent=text}
function open(id){
active=id;selection=null;multi=new Set();sequence=[];
$("overlay").classList.add("open");
if(id==="door"){
$("kicker").textContent="Финальная дверь";
$("modalTitle").textContent=done.size===5?"Выход открыт!":"Дверь заперта";
$("prompt").textContent=done.size===5?"Ты восстановил все пять фрагментов знаний. Код собран: "+order.map(x=>tasks[x].digit).join("")+". Миссия выполнена!":"Для выхода нужно выполнить все пять заданий. Найди светящиеся предметы и собери код.";
$("taskArea").innerHTML="";$("controls").innerHTML=`<button class="action primary" id="goBack">Вернуться в кабинет</button>`;$("goBack").onclick=close;feedback("", "");return;
}
const t=tasks[id];
$("kicker").textContent="Испытание "+(order.indexOf(id)+1)+" из 5";
$("modalTitle").textContent=t.title;
$("prompt").textContent=t.prompt;
$("taskArea").innerHTML="";
$("controls").innerHTML="";
feedback("", "");
if(done.has(id)){feedback("Уже выполнено! Получена цифра "+t.digit+". "+t.explain,"ok");addButton("Закрыть",close,true);return;}
if(t.kind==="single"||t.kind==="multi"){
$("taskArea").innerHTML=`<div class="options">${t.options.map((x,i)=>`<button class="option" data-choice="${i}">${escapeHTML(x)}</button>`).join("")}</div>`;
$("taskArea").querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{
const i=Number(b.dataset.choice);
if(t.kind==="single")selection=i;
else{if(multi.has(i))multi.delete(i);else multi.add(i)}
$("taskArea").querySelectorAll("[data-choice]").forEach(e=>e.classList.toggle("selected",t.kind==="single"?Number(e.dataset.choice)===selection:multi.has(Number(e.dataset.choice))));
});
}else if(t.kind==="match"){
$("taskArea").innerHTML=t.pairs.map(([word],i)=>`<label for="pair${i}">${escapeHTML(word)}</label><select id="pair${i}"><option value="">Выбери часть речи</option>${t.choices.map(c=>`<option>${escapeHTML(c)}</option>`).join("")}</select>`).join("");
}else if(t.kind==="sequence"){
$("taskArea").innerHTML=`<div class="seq" id="chips">${t.pieces.map((p,i)=>`<button class="chip" data-piece="${i}">${escapeHTML(p)}</button>`).join("")}</div><div class="sequence" id="sequence">Нажимай на слова по порядку</div><button class="action" id="clearSequence" style="margin-top:5px">Очистить</button>`;
$("chips").querySelectorAll("[data-piece]").forEach(b=>b.onclick=()=>{const i=Number(b.dataset.piece);if(sequence.includes(i))return;sequence.push(i);b.classList.add("picked");$("sequence").textContent=sequence.map(j=>t.pieces[j]).join(" ")});
$("clearSequence").onclick=()=>{sequence=[];$("sequence").textContent="Нажимай на слова по порядку";$("chips").querySelectorAll("button").forEach(b=>b.classList.remove("picked"))};
}else if(t.kind==="text"){
$("taskArea").innerHTML='<label for="written">Твое исправление</label><input id="written" type="text" autocomplete="off" placeholder="Напиши правильный вариант">';
}
addButton("Проверить",()=>check(t),true);
addButton("Подсказка",()=>feedback(t.hint,"hint"),false);
}
function addButton(label,fn,primary){const b=document.createElement("button");b.className="action"+(primary?" primary":"");b.textContent=label;b.onclick=fn;$("controls").appendChild(b)}
function check(t){
let valid=false;
if(t.kind==="single")valid=selection===t.correct;
if(t.kind==="multi")valid=multi.size===t.correct.length&&t.correct.every(x=>multi.has(x));
if(t.kind==="match")valid=t.pairs.every((p,i)=>$("pair"+i).value===p[1]);
if(t.kind==="sequence")valid=sequence.length===t.correct.length&&sequence.every((x,i)=>t.pieces[x]===t.correct[i]);
if(t.kind==="text")valid=t.correct.includes(($("written").value||"").toLowerCase().replace(/\s+/g," ").trim().replace(/[.!?]+$/,""));
if(valid){
done.add(active);update();
feedback("Верно! Получена цифра "+t.digit+". "+t.explain,"ok");
$("controls").innerHTML="";addButton("Продолжить исследование",close,true);
}else feedback("Пока не получилось. Проверь ответ или воспользуйся подсказкой.","bad");
}
function close(){$("overlay").classList.remove("open");active=null}
document.querySelectorAll(".hotspot").forEach(b=>b.addEventListener("click",()=>open(b.dataset.id)));
$("close").onclick=close;
